name: Bug report
description: Something does not work as expected
body:
  - type: markdown
    attributes:
      value: |
        Security problems: please do not report them here, see SECURITY.md.
        Do not post your private keys, keystore files or passwords. Your Core address is fine.
  - type: input
    id: version
    attributes:
      label: CoreStarter version
      description: Shown in the window under "About" (e.g. 1.0.0)
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options: [Windows, Linux (.deb), Linux (.rpm), Linux (.tar.gz), macOS]
    validations:
      required: true
  - type: input
    id: osversion
    attributes:
      label: System version
      description: e.g. Windows 11 24H2, Ubuntu 24.04, macOS 15.4
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Tray menu → log folder (starter.log, gocore.log, miner.log). Paste the relevant lines.
      render: text
