# Release build on Linux (gocore + DLLs + core-miner via MinGW), then tests on
# a real Windows machine. The node runs offline (--nodiscover --maxpeers 0
# --nat none) and the miner only talks to a pool on loopback: no contact with
# the Core network or Catch That Rabbit.
name: windows

on:
  push:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      draft_tag:
        description: "Test tag of an existing draft release (vX.Y.Z-testN): attach the tested build"
        type: string
        default: ""

# A newer push to the same branch cancels the run still going (saves minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50 # the build takes ~10 min; up to two apt retries of 10 min each
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.14"
          cache: false
      - name: Tools (MinGW-w64, CMake; GTK/WebKit for the Linux code in the portable tests)
        # Twice on 20.11.2026 this step hung silently until the job limit (30 min).
        # No questions (noninteractive), no man-db rebuild, a time limit per try
        # and up to three tries; the log of a failed try stays visible.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          # A stalled server must not hold a whole try: 30 s per connection.
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120"
          for try in 1 2 3; do
            if timeout 600 sh -c "sudo -E apt-get $APT update && sudo -E apt-get $APT install -y -qq mingw-w64 cmake libgtk-3-dev libwebkit2gtk-4.1-dev" >/tmp/apt.log 2>&1; then
              break
            fi
            echo "::warning::apt try $try failed or took over 10 min"; tail -30 /tmp/apt.log
            ps -eo pid,etime,cmd | grep -E "apt|dpkg|unattended" | grep -v grep || true
            [ "$try" = 3 ] && exit 1
          done
          # The compiler builds core-miner.exe for the release: record which one.
          dpkg-query -W mingw-w64 gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix cmake
          x86_64-w64-mingw32-gcc-posix --version | head -1
      - name: Build (downloads + SHA-256 checks + miner + DLL import check)
        run: ./scripts/build.sh
      - name: Committed generated files unchanged
        run: git diff --exit-code
      - name: Portable tests
        run: go test -race -count=1 . ./internal/...
      - name: Miner tests (Linux, native RandomY)
        run: |
          cmake -S third_party/RandomY -B .cache/randomy-linux -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build .cache/randomy-linux -j"$(nproc)" --target randomx >/dev/null
          CGO_LDFLAGS="-L$PWD/.cache/randomy-linux" go test -count=1 -v ./cmd/core-miner
      - name: Miner test binary for Windows
        run: |
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 \
            CC=x86_64-w64-mingw32-gcc-posix CXX=x86_64-w64-mingw32-g++-posix \
            CGO_LDFLAGS="-L$PWD/.cache/randomy-win" \
            go test -c -o dist/tests/core-miner-test.exe ./cmd/core-miner
      # The build reaches the Windows job through the Actions cache (own 10 GB
      # per repository), not as an artifact: artifacts count against the
      # organisation's monthly storage, and a full quota stopped every test run.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          key: windows-build-${{ github.run_id }}
          enableCrossOsArchive: true
          path: |
            payload/
            payload_gen_windows.go
            dist/
      # A downloadable copy only on a manual run.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          name: build
          path: |
            payload/
            payload_gen_windows.go
            dist/
          retention-days: 3

  windows:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          key: windows-build-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
          path: |
            payload/
            payload_gen_windows.go
            dist/
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.14"
          cache: false
      - name: Exe checksum
        shell: pwsh
        run: |
          Get-FileHash dist/CoreStarter.exe -Algorithm SHA256
          Get-Content dist/CoreStarter.exe.sha256
      - name: go vet
        run: go vet .
      - name: Network map on Windows (address book read while open, file sharing)
        run: go test -count=1 -v ./internal/netmap
      - name: Miner on Windows (self-test, verified shares against a loopback pool)
        shell: bash # PowerShell splits -test.v into -test .v
        run: dist/tests/core-miner-test.exe -test.v -test.count=1
      - name: Integration tests (real gocore offline, miner supervisor, settings window)
        env:
          CORE_NODE_STARTER_WINDOWS_IT: "1"
        run: go test -v -count=1 -timeout 30m -run Windows .

  # A tested build for testers, attached to a draft release (not public).
  # Only this job may write, and only on a manual run with a test tag; it
  # builds nothing itself and runs after the tests on Windows passed.
  draft:
    needs: [build, windows]
    if: github.event_name == 'workflow_dispatch' && inputs.draft_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          key: windows-build-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
          path: |
            payload/
            payload_gen_windows.go
            dist/
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.draft_tag }}
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+-test[0-9]+$ ]] || { echo "not a test tag: $TAG" >&2; exit 1; }
          [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = true ] || { echo "$TAG is no draft release" >&2; exit 1; }
          gh release upload "$TAG" dist/CoreStarter.exe dist/CoreStarter.exe.sha256 --clobber
